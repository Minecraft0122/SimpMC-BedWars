name: SimpMC-BedWars
api-version: '1.21'
version: ${project.version}
author: SimpMC
prefix: SimpMC-BedWars
description: 面向 Paper 1.21.11 与 26.2 的中文起床战争小游戏插件
main: com.andrei1058.bedwars.BedWars
softdepend: [Vault,PlaceholderAPI,Citizens,Parties,VipFeatures,PartyAndFriends,Spigot-Party-API-PAF]
commands:
  shout:
    description: 在游戏内向全场发送消息
    usage: /shout <消息>
    aliases: [hh, h]
permissions:
  bw.player:
    description: 旧版普通玩家命令集合；官方无需权限的命令现在无需授予此节点
    default: false
    children:
      bw.command.help: true
      bw.command.cmds: true
      bw.command.join: true
      bw.command.leave: true
      bw.command.lang: true
      bw.command.gui: true
      bw.command.stats: true
      bw.command.team: true
      bw.command.invite: true
      bw.command.teleporter: true
      bw.command.upgradesmenu: true
      bw.command.party: true
  'bw.command.*':
    description: 所有 BedWars 命令权限，不包含其他游戏特权
    default: false
    children:
      bw.command.help: true
      bw.command.cmds: true
      bw.command.join: true
      bw.command.leave: true
      bw.command.lang: true
      bw.command.teleporter: true
      bw.command.gui: true
      bw.command.stats: true
      bw.command.team: true
      bw.command.invite: true
      bw.command.forcestart: true
      bw.command.start: true
      bw.command.setlobby: true
      bw.command.setuparena: true
      bw.command.arenalist: true
      bw.command.delarena: true
      bw.command.enablearena: true
      bw.command.disablearena: true
      bw.command.clonearena: true
      bw.command.arenagroup: true
      bw.command.build: true
      bw.command.level: true
      bw.command.reload: true
      bw.command.autocreateteams: true
      bw.command.setwaitingspawn: true
      bw.command.setspectspawn: true
      bw.command.createteam: true
      bw.command.listteams: true
      bw.command.waitingpos: true
      bw.command.removeteam: true
      bw.command.setmaxinteam: true
      bw.command.setminplayers: true
      bw.command.setmininteam: true
      bw.command.setmaxbuildheight: true
      bw.command.setspawn: true
      bw.command.setbed: true
      bw.command.setshop: true
      bw.command.setupgrade: true
      bw.command.addgenerator: true
      bw.command.removegenerator: true
      bw.command.settype: true
      bw.command.save: true
      bw.command.npc: true
      bw.command.tp: true
      bw.command.upgradesmenu: true
      bw.command.setkilldrops: true
      bw.command.shout: true
      bw.command.rejoin: true
      bw.command.party: true
  bw.rejoin:
    description: 重新加入仍处于有效重连窗口的竞技场
    default: false
  bw.shout:
    description: 使用 /shout、/hh、/h 或六种前缀进行全场喊话
    default: true
  bw.forcestart:
    description: 强制开始当前竞技场
    default: false
  bw.tp:
    description: 使用管理员传送命令
    default: false
  bw.groups:
    description: 管理竞技场分组
    default: false
  bw.build:
    description: 切换竞技场建造模式
    default: false
  bw.clone:
    description: 克隆竞技场
    default: false
  bw.delete:
    description: 删除竞技场
    default: false
  bw.disable:
    description: 禁用竞技场
    default: false
  bw.enable:
    description: 启用竞技场
    default: false
  bw.enableRotation:
    description: 旧版启用竞技场权限别名；请改用 bw.enable
    default: false
  bw.npc:
    description: 管理加入竞技场的 NPC
    default: false
  bw.reload:
    description: 重载插件配置
    default: false
  bw.setup:
    description: 设置大厅和竞技场
    default: false
  bw.level:
    description: 管理玩家等级
    default: false
  bw.vip:
    description: VIP 满服加入及相关特权
    default: false
  bw.chatcolor:
    description: 在聊天消息中使用颜色代码
    default: false
  bw.cmd.bypass:
    description: 绕过竞技场内的命令限制
    default: false
  'bw.*':
    description: 官方 BedWars 全命令权限
    default: op
#load: STARTUP
