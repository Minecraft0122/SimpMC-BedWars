name: 构建、测试与自动发布

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # 默认分支的每个提交都必须完成构建并发布，不能被后续提交取消。
  cancel-in-progress: false

jobs:
  build:
    name: Maven 验证
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 使用 Maven 构建并测试
        run: mvn -B -U verify -s ci_settings.xml

      - name: 验证 Paper 1.21.11 运行契约
        shell: bash
        env:
          PAPER_URL: https://fill-data.papermc.io/v1/objects/5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba/paper-1.21.11-132.jar
          PAPER_SHA256: 5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba
        run: |
          set -euo pipefail

          runtime="$RUNNER_TEMP/paper-1.21.11-tab-contract"
          mkdir -p "$runtime"
          curl --fail --location --retry 3 \
            --user-agent 'SimpMC-BedWars-CI/1.0 (https://github.com/Minecraft0122/SimpMC-BedWars)' \
            --output "$runtime/paperclip.jar" "$PAPER_URL"
          echo "$PAPER_SHA256  $runtime/paperclip.jar" | sha256sum --check
          (cd "$runtime" && java -jar paperclip.jar --help >/dev/null)

          patched_server="$runtime/versions/1.21.11/paper-1.21.11.jar"
          test -f "$patched_server"
          classpath="bedwars-api/target/test-classes:bedwars-api/target/classes:versionsupport_common/target/classes:versionsupport_v1_21_R3/target/test-classes:versionsupport_v1_21_R3/target/classes:$patched_server"
          while IFS= read -r library; do
            classpath="$classpath:$library"
          done < <(find "$runtime/libraries" -type f -name '*.jar' | sort)

          java -cp "$classpath" \
            com.andrei1058.spigot.sidebar.PlayerListDisplayNamePacketsRuntimeProbe
          java -cp "$classpath" \
            com.andrei1058.bedwars.api.PaperGameRulesRuntimeProbe
          java -cp "$classpath" \
            com.andrei1058.bedwars.support.version.v1_21_R3.FireballAccelerationRuntimeProbe

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: 覆盖编译 Paper 26.2 API 与运行探针
        # 必须 clean；只切换依赖属性时 Maven 增量编译不会重新编译源码。
        run: mvn -B -ntp clean test-compile -Dpaper.api.version=26.2.build.112-stable -DskipTests -s ci_settings.xml

      - name: 验证 Paper 26.2 运行契约
        shell: bash
        env:
          PAPER_URL: https://fill-data.papermc.io/v1/objects/bd3a58cf96874e5ea6643f5f6fe9b4f5bf9e34b795fa078c2f0ee8b98b2f907e/paper-26.2-112.jar
          PAPER_SHA256: bd3a58cf96874e5ea6643f5f6fe9b4f5bf9e34b795fa078c2f0ee8b98b2f907e
        run: |
          set -euo pipefail

          runtime="$RUNNER_TEMP/paper-26.2-contract"
          mkdir -p "$runtime"
          curl --fail --location --retry 3 \
            --user-agent 'SimpMC-BedWars-CI/1.0 (https://github.com/Minecraft0122/SimpMC-BedWars)' \
            --output "$runtime/paperclip.jar" "$PAPER_URL"
          echo "$PAPER_SHA256  $runtime/paperclip.jar" | sha256sum --check
          (cd "$runtime" && java -jar paperclip.jar --help >/dev/null)

          patched_server="$runtime/versions/26.2/paper-26.2.jar"
          test -f "$patched_server"
          classpath="bedwars-api/target/test-classes:bedwars-api/target/classes:versionsupport_common/target/classes:versionsupport_v1_21_R3/target/test-classes:versionsupport_v1_21_R3/target/classes:$patched_server"
          while IFS= read -r library; do
            classpath="$classpath:$library"
          done < <(find "$runtime/libraries" -type f -name '*.jar' | sort)

          java -cp "$classpath" \
            com.andrei1058.spigot.sidebar.PlayerListDisplayNamePacketsRuntimeProbe
          java -cp "$classpath" \
            com.andrei1058.bedwars.api.PaperGameRulesRuntimeProbe
          java -cp "$classpath" \
            com.andrei1058.bedwars.support.version.v1_21_R3.FireballAccelerationRuntimeProbe

      - name: 恢复 JDK 21 发布环境
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 干净重建发布 JAR
        # Paper 26.2 覆盖编译会清理 target；发布包必须重新以默认 Paper 1.21.11 API 构建。
        run: mvn -B -ntp clean package -DskipTests -s ci_settings.xml

      - name: 核对角色包清单与入口
        shell: bash
        run: |
          set -euo pipefail

          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          lobby_path="bedwars-lobby/target/SimpMC-BedWars-Lobby-${version}.jar"
          arena_path="bedwars-arena/target/SimpMC-BedWars-Arena-${version}.jar"
          test -f "$lobby_path"
          test -f "$arena_path"
          test -z "$(find bedwars-lobby/target -maxdepth 1 -type f -name 'SimpMC-BedWars-Lobby-*.jar' ! -name 'original-*.jar' ! -name "SimpMC-BedWars-Lobby-${version}.jar" -print -quit)"
          test -z "$(find bedwars-arena/target -maxdepth 1 -type f -name 'SimpMC-BedWars-Arena-*.jar' ! -name 'original-*.jar' ! -name "SimpMC-BedWars-Arena-${version}.jar" -print -quit)"

          grep -Fx "version: ${version}" < <(unzip -p "$lobby_path" plugin.yml)
          grep -Fx "main: com.andrei1058.bedwars.lobby.LobbyBedWarsPlugin" < <(unzip -p "$lobby_path" plugin.yml)
          grep -Fx "version: ${version}" < <(unzip -p "$arena_path" plugin.yml)
          grep -Fx "main: com.andrei1058.bedwars.arena.ArenaBedWarsPlugin" < <(unzip -p "$arena_path" plugin.yml)

      - name: 上传大厅与竞技场插件 JAR
        uses: actions/upload-artifact@v7
        with:
          name: SimpMC-BedWars-roles
          path: |
            bedwars-lobby/target/SimpMC-BedWars-Lobby-*.jar
            !bedwars-lobby/target/original-*.jar
            bedwars-arena/target/SimpMC-BedWars-Arena-*.jar
            !bedwars-arena/target/original-*.jar
          if-no-files-found: error

  release:
    name: 发布到 GitHub Releases
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 下载已验证的大厅与竞技场插件 JAR
        uses: actions/download-artifact@v8
        with:
          name: SimpMC-BedWars-roles
          path: release

      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 发布任务不检出源码，必须显式告诉 gh 当前仓库。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # download-artifact may preserve the module/target directory for
          # multiple upload roots, so do not assume both files are at release/.
          mapfile -t lobby_jars < <(find release -type f -name 'SimpMC-BedWars-Lobby-*.jar' ! -name 'original-*.jar' | sort)
          mapfile -t arena_jars < <(find release -type f -name 'SimpMC-BedWars-Arena-*.jar' ! -name 'original-*.jar' | sort)
          if [[ ${#lobby_jars[@]} -ne 1 || ${#arena_jars[@]} -ne 1 ]]; then
            echo "错误：预期各有一个大厅和竞技场插件 JAR，实际大厅 ${#lobby_jars[@]} 个、竞技场 ${#arena_jars[@]} 个。" >&2
            printf '%s\n' "${lobby_jars[@]:-}" "${arena_jars[@]:-}"
            exit 1
          fi

          lobby_path="${lobby_jars[0]}"
          arena_path="${arena_jars[0]}"
          lobby_name="$(basename "$lobby_path")"
          arena_name="$(basename "$arena_path")"
          version="${lobby_name#SimpMC-BedWars-Lobby-}"
          version="${version%.jar}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "错误：无法从 $lobby_name 解析标准版本号。" >&2
            exit 1
          fi
          if [[ "$arena_name" != "SimpMC-BedWars-Arena-${version}.jar" ]]; then
            echo "错误：大厅与竞技场 JAR 的版本不一致：$lobby_name / $arena_name。" >&2
            exit 1
          fi

          lobby_plugin_yml="$(unzip -p "$lobby_path" plugin.yml)"
          arena_plugin_yml="$(unzip -p "$arena_path" plugin.yml)"
          grep -Fx "version: ${version}" <<< "$lobby_plugin_yml"
          grep -Fx "main: com.andrei1058.bedwars.lobby.LobbyBedWarsPlugin" <<< "$lobby_plugin_yml"
          grep -Fx "version: ${version}" <<< "$arena_plugin_yml"
          grep -Fx "main: com.andrei1058.bedwars.arena.ArenaBedWarsPlugin" <<< "$arena_plugin_yml"

          short_sha="${GITHUB_SHA:0:8}"
          tag="v${version}-${short_sha}"
          title="SimpMC-BedWars ${version} (${short_sha})"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          checksum_path="release/SHA256SUMS.txt"
          lobby_relative="${lobby_path#release/}"
          arena_relative="${arena_path#release/}"
          (
            cd release
            {
              sha256sum "$lobby_relative" | awk -v name="$lobby_name" '{print $1 "  " name}'
              sha256sum "$arena_relative" | awk -v name="$arena_name" '{print $1 "  " name}'
            } > "$(basename "$checksum_path")"
          )

          # 工作流重跑时复用同一提交标签，避免生成重复 Release。
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，无需重复发布。"
            exit 0
          fi

          gh release create "$tag" "$lobby_path" "$arena_path" "$checksum_path" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "由默认分支提交 [${short_sha}](${commit_url}) 自动构建。构建、测试和 JAR 上传全部成功后才会发布。" \
            --generate-notes \
            --latest
