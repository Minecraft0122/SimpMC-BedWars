name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper_api:
          - 1.21.1-R0.1-SNAPSHOT
          - 1.21.11-R0.1-SNAPSHOT
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -U -DskipTests "-Dpaper.api.version=${{ matrix.paper_api }}" package -s ci_settings.xml

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: BedWars1058-plugin-${{ matrix.paper_api }}
          path: |
            bedwars-plugin/target/*.jar
            !bedwars-plugin/target/original-*.jar
          if-no-files-found: error
