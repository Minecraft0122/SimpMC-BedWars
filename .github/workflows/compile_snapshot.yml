name: 构建与测试

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven 验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 使用 Maven 构建并测试
        run: mvn -B -U verify -s ci_settings.xml

      - name: 上传插件 JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimpMC-BedWars
          path: |
            bedwars-plugin/target/SimpMC-BedWars-*.jar
            !bedwars-plugin/target/original-*.jar
          if-no-files-found: error
