name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -U -DskipTests package -s ci_settings.xml

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: SimpMC-BedWars
          path: |
            bedwars-plugin/target/SimpMC-BedWars-*.jar
            !bedwars-plugin/target/original-*.jar
          if-no-files-found: error
